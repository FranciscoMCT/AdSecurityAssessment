<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<meta name="generator" content="{{GENERATOR}}">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --text:#1b1f27; --muted:#5a6472; --border:#d9dde4; --accent:#0f6cbd;
  --critical:#b3261e; --high:#c2410c; --medium:#a16207; --low:#1d4ed8; --info:#5a6472; --ok:#1a7f4b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151a; --surface:#1b1f27; --surface-2:#242a34; --text:#e8ebf0; --muted:#9aa4b2; --border:#323a47; --accent:#4cc2ff;
        --critical:#ff6b61; --high:#ff9a5c; --medium:#f2c14e; --low:#6ea8ff; --info:#9aa4b2; --ok:#4ddb94; --shadow:none}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 64px}
header.cover{background:linear-gradient(135deg,#0b3d6e,#0f6cbd);color:#fff;border-radius:14px;padding:28px 28px 22px;box-shadow:var(--shadow)}
header.cover h1{margin:0 0 4px;font-size:26px;font-weight:650;letter-spacing:.2px}
header.cover p{margin:2px 0;opacity:.92}
.notice{border:1px solid var(--border);border-left:4px solid var(--medium);background:var(--surface);border-radius:8px;padding:10px 14px;margin:14px 0;color:var(--text)}
.demo{border-left-color:var(--critical);font-weight:600}
nav.toc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin:16px 0}
nav.toc a{display:inline-block;margin:2px 12px 2px 0;color:var(--accent);text-decoration:none}
nav.toc a:hover{text-decoration:underline}
section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin:18px 0;box-shadow:var(--shadow)}
section h2{margin:0 0 12px;font-size:19px}
h3{margin:18px 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface-2);border-radius:10px;padding:12px 14px;border:1px solid var(--border)}
.card .v{font-size:26px;font-weight:650;line-height:1.1}
.card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.score{font-size:46px;font-weight:700}
.sev{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:650;color:#fff}
.sev.Critical{background:var(--critical)} .sev.High{background:var(--high)} .sev.Medium{background:var(--medium)}
.sev.Low{background:var(--low)} .sev.Informational{background:var(--info)}
table{border-collapse:collapse;width:100%;margin:8px 0 4px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--surface-2)}
td.num,th.num{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.finding{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:14px 0;background:var(--surface)}
.finding h4{margin:0 0 6px;font-size:15px}
.finding .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
code,.mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:12.5px;word-break:break-all}
details{margin:6px 0}
summary{cursor:pointer;color:var(--accent)}
a{color:var(--accent)}
footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
@media print{
  body{background:#fff;color:#000} .wrap{max-width:none;padding:0}
  section,.finding{box-shadow:none;break-inside:avoid-page} nav.toc{display:none}
  header.cover{background:#0b3d6e;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sev{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  details>*{display:block} details summary{display:none}
}
</style>
</head>
<body>
<div class="wrap">
{{BODY}}
<footer>{{FOOTER}}</footer>
</div>
</body>
</html>
